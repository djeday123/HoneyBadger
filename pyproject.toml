[build-system]
requires = ["setuptools>=61.0", "cffi>=1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honeybadger"
version = "0.1.0"
description = "DataFrame with CSV reading, basic operations, filtering, and C library wrappers for FFTW (FFT) and GSL (statistics)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "cffi>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["honeybadger*"]
